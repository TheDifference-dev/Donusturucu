name: Dönüştürücü Windows exe

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bağımlılıklar
        run: python -m pip install -r requirements.txt pyinstaller pywebview pytest

      - name: Testler (gerçek Windows üzerinde)
        run: python -m pytest -q tests

      - name: Exe oluştur (PyInstaller)
        run: pyinstaller --noconfirm --log-level WARN paketleme/donusturucu.spec

      - name: Exe öz testi
        run: |
          $p = Start-Process -FilePath dist\Donusturucu\Donusturucu.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\Donusturucu\calisma.log" -Tail 40
          if ($p.ExitCode -ne 0) { throw "Öz test başarısız (çıkış kodu $($p.ExitCode))" }

      - name: Kurulum exe'si (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc paketleme\kurulum.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC hata verdi" }

      - name: Taşınabilir ZIP
        run: Compress-Archive -Path dist\Donusturucu -DestinationPath dist\Donusturucu_Tasinabilir.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DonusturucuKurulum-${{ env.APP_VERSION }}
          path: |
            dist/DonusturucuKurulum.exe
            dist/Donusturucu_Tasinabilir.zip

      - name: Sürümü yayınla (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "donusturucu-v$env:APP_VERSION"
          $notes = "Kurulum: DonusturucuKurulum.exe dosyasını indirip çift tıklayın. Masaüstüne 'Dönüştürücü' kısayolu eklenir. Yönetici izni gerekmez."
          gh release create $tag dist\DonusturucuKurulum.exe dist\Donusturucu_Tasinabilir.zip --target $env:GITHUB_SHA --title "Dönüştürücü $env:APP_VERSION" --notes $notes --prerelease
